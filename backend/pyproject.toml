[project]
name = "secureops-backend"
version = "0.1.0"
description = "SecureOps — Unified Security Operations & GRC Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "azure-storage-blob>=12.24.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "structlog>=24.4.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4",
    "types-aiofiles>=24.1.0",
    "bandit>=1.8.0",
    "safety>=3.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = [
    "B008",   # FastAPI dependency injection idiom: Depends()/Query() in defaults
    "UP042",  # str+Enum -> StrEnum changes str() output; tracked as tech debt
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001", "PT011", "B017", "ARG001", "ARG002"]
"alembic/**" = ["E501"]
# Seed data: long lines are control titles/descriptions; print is the CLI entrypoint
"app/db/seed.py" = ["E501"]
"app/services/seed_frameworks.py" = ["E501", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database/redis",
    "e2e: End-to-end tests",
    "security: Security-focused tests",
    "performance: Performance/load tests",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
