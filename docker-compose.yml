services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureops
      POSTGRES_PASSWORD: secureops
      POSTGRES_DB: secureops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECUREOPS_ENVIRONMENT: development
      SECUREOPS_DATABASE_URL: postgresql+asyncpg://secureops:secureops@db:5432/secureops
      SECUREOPS_REDIS_URL: redis://redis:6379/0
      SECUREOPS_CELERY_BROKER_URL: redis://redis:6379/1
      SECUREOPS_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - evidence-data:/app/evidence-store

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      SECUREOPS_ENVIRONMENT: development
      SECUREOPS_DATABASE_URL: postgresql+asyncpg://secureops:secureops@db:5432/secureops
      SECUREOPS_REDIS_URL: redis://redis:6379/0
      SECUREOPS_CELERY_BROKER_URL: redis://redis:6379/1
      SECUREOPS_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - evidence-data:/app/evidence-store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  evidence-data:
